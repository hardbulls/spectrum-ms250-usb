<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scoreboard Serial Tool</title>
<style>
  body { font-family: ui-monospace, Menlo, Consolas, monospace; background: #111; color: #ddd; margin: 0; padding: 16px; }
  h1 { font-size: 15px; color: #9cf; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  select, input, button { background: #1c1c1c; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 5px 8px; font: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: #888; }
  button:disabled { opacity: 0.4; cursor: default; }
  #log { background: #000; border: 1px solid #333; border-radius: 4px; padding: 8px; height: 60vh; overflow-y: auto; white-space: pre; font-size: 12px; line-height: 1.5; }
  .t { color: #666; }
  .hex { color: #9cf; }
  .ascii { color: #9c9; }
  .tx { color: #f96; }
  .status { font-size: 12px; margin-left: 8px; }
  .ok { color: #9c9; }
  .err { color: #f66; }
  label { font-size: 12px; color: #aaa; }
</style>
</head>
<body>
<h1>Scoreboard Serial Sniffer / Sender (Web Serial API)</h1>

<div class="row">
  <button id="connectBtn">Connect port</button>
  <button id="disconnectBtn" disabled>Disconnect</button>
  <label>Baud <input id="baud" type="number" value="9600" style="width:80px"></label>
  <span style="color:#888; font-size:12px;">common: 300, 1200, 2400, 4800, 9600, 19200, 38400, 57600, 115200</span>
  <label>Data bits
    <select id="dataBits"><option>8</option><option>7</option></select>
  </label>
  <label>Stop bits
    <select id="stopBits"><option>1</option><option>2</option></select>
  </label>
  <label>Parity
    <select id="parity"><option>none</option><option>even</option><option>odd</option></select>
  </label>
  <span id="status" class="status">disconnected</span>
</div>

<div class="row">
  <button id="clearBtn">Clear log</button>
  <label><input type="checkbox" id="pauseChk"> pause</label>
  <span style="color:#888">Bytes received: <span id="count">0</span></span>
</div>

<div class="row">
  <label>Send hex bytes (e.g. <code>02 31 32 03</code>)</label>
  <input id="sendHex" style="flex:1; min-width:300px" placeholder="hex bytes separated by spaces">
  <button id="sendBtn" disabled>Send</button>
</div>

<div id="log"></div>

<script>
let port, reader, writer, keepReading = false;
let byteCount = 0;

const $ = id => document.getElementById(id);
const log = $('log');
const statusEl = $('status');

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = 'status ' + (cls || '');
}

function appendLine(html) {
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  const div = document.createElement('div');
  div.innerHTML = html;
  log.appendChild(div);
  if (atBottom) log.scrollTop = log.scrollHeight;
}

function timestamp() {
  const d = new Date();
  return d.toTimeString().split(' ')[0] + '.' + String(d.getMilliseconds()).padStart(3, '0');
}

function toHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(' ');
}

function toAscii(bytes) {
  return Array.from(bytes).map(b => (b >= 32 && b < 127) ? String.fromCharCode(b) : '.').join('');
}

async function connect() {
  if (!('serial' in navigator)) {
    alert('Web Serial API not available. Use Chrome or Edge, and serve this page over http(s):// or file://.');
    return;
  }
  try {
    port = await navigator.serial.requestPort();
    await port.open({
      baudRate: parseInt($('baud').value, 10),
      dataBits: parseInt($('dataBits').value, 10),
      stopBits: parseInt($('stopBits').value, 10),
      parity: $('parity').value,
    });
    setStatus('connected', 'ok');
    $('connectBtn').disabled = true;
    $('disconnectBtn').disabled = false;
    $('sendBtn').disabled = false;
    keepReading = true;
    readLoop();
  } catch (e) {
    setStatus('error: ' + e.message, 'err');
  }
}

async function readLoop() {
  while (port.readable && keepReading) {
    reader = port.readable.getReader();
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        if (value && value.length && !$('pauseChk').checked) {
          byteCount += value.length;
          $('count').textContent = byteCount;
          appendLine(
            `<span class="t">[${timestamp()}]</span> <span class="hex">${toHex(value)}</span>  <span class="ascii">${toAscii(value)}</span>`
          );
        }
      }
    } catch (e) {
      appendLine(`<span class="err">[${timestamp()}] read error: ${e.message}</span>`);
    } finally {
      reader.releaseLock();
    }
  }
}

async function disconnect() {
  keepReading = false;
  try { if (reader) { await reader.cancel(); } } catch (e) {}
  try { if (writer) { writer.releaseLock(); } } catch (e) {}
  try { if (port) { await port.close(); } } catch (e) {}
  setStatus('disconnected');
  $('connectBtn').disabled = false;
  $('disconnectBtn').disabled = true;
  $('sendBtn').disabled = true;
}

async function sendHex() {
  const raw = $('sendHex').value.trim();
  if (!raw || !port || !port.writable) return;
  const parts = raw.split(/\s+/).map(h => parseInt(h, 16));
  if (parts.some(isNaN)) {
    appendLine(`<span class="err">[${timestamp()}] invalid hex input</span>`);
    return;
  }
  const bytes = new Uint8Array(parts);
  writer = port.writable.getWriter();
  try {
    await writer.write(bytes);
    appendLine(`<span class="t">[${timestamp()}]</span> <span class="tx">TX ${toHex(bytes)}</span>  <span class="ascii">${toAscii(bytes)}</span>`);
  } catch (e) {
    appendLine(`<span class="err">[${timestamp()}] write error: ${e.message}</span>`);
  } finally {
    writer.releaseLock();
  }
}

$('connectBtn').addEventListener('click', connect);
$('disconnectBtn').addEventListener('click', disconnect);
$('clearBtn').addEventListener('click', () => { log.innerHTML = ''; byteCount = 0; $('count').textContent = 0; });
$('sendBtn').addEventListener('click', sendHex);
$('sendHex').addEventListener('keydown', e => { if (e.key === 'Enter') sendHex(); });
</script>
</body>
</html>
